name: Build aarch64 Packages

# Native ARM builds for manual use or an installer's reusable workflow.
# Artifacts are unsigned. Production signing and publishing belong on the
# repository host, via bin/upload-prebuilt --arch aarch64 --mirror <mirror>.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated recipe directory names (empty = every eligible package).
          Include required recipes from this repository; dependencies are not added automatically.
        type: string
        default: ""
      mirror:
        description: "Build channel (package channel and release-ring policy applies)"
        type: choice
        options: [edge, rc, stable]
        default: edge
  workflow_call:
    inputs:
      pkgs_repository:
        description: "owner/name of the omarchy-pkgs checkout to build"
        type: string
        required: true
      pkgs_ref:
        description: "branch, tag or SHA of that repository"
        type: string
        required: true
      packages:
        description: >-
          Space-separated recipe directory names (empty = every eligible package).
          Include required recipes from this repository; dependencies are not added automatically.
        type: string
        default: ""
      mirror:
        type: string
        default: edge
    secrets:
      BASECAMP_CHATBOT_URL:
        required: false
    outputs:
      artifact:
        description: "Name of the uploaded repository artifact"
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # Targeted builds must include required recipes from this repository.
    # A full build may exceed GitHub's six-hour job limit.
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    env:
      ARCH: aarch64
      INPUT_MIRROR: ${{ inputs.mirror }}
      INPUT_PACKAGES: ${{ inputs.packages }}
    steps:
      - name: Checkout omarchy-pkgs
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pkgs_repository || github.repository }}
          ref: ${{ inputs.pkgs_ref || github.ref }}
          persist-credentials: false

      - name: Confirm the runner is natively aarch64
        id: native
        # bin/build falls back to QEMU when it finds an x86_64 host. That still
        # produces correct packages, but takes many times longer -- long enough
        # to hit the job timeout. If this ever runs somewhere else, fail loudly
        # rather than silently emulating.
        run: |
          set -euo pipefail
          arch=$(uname -m)
          echo "Runner architecture: $arch"
          if [[ $arch != "aarch64" ]]; then
            echo "::error::Expected a native aarch64 runner, got $arch." \
                 "Building aarch64 under emulation here would exceed the job timeout."
            exit 1
          fi

      - name: Resolve inputs
        id: meta
        run: |
          MIRROR="${INPUT_MIRROR:-edge}"
          PACKAGES="$INPUT_PACKAGES"
          case "$MIRROR" in edge|rc|stable) ;; *) echo "invalid mirror: $MIRROR" >&2; exit 1 ;; esac
          re='^[A-Za-z0-9._+ -]*$'
          if ! [[ $PACKAGES =~ $re ]]; then echo "invalid package list" >&2; exit 1; fi
          read -r -a packages <<< "$PACKAGES"
          for package in "${packages[@]}"; do
            if ! [[ $package =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ && -f pkgbuilds/$package/PKGBUILD ]]; then
              echo "unknown recipe: $package" >&2
              exit 1
            fi
          done
          PACKAGES="${packages[*]}"
          {
            echo "MIRROR=$MIRROR"
            echo "PACKAGES=$PACKAGES"
            echo "REPO_DIR=pkgs.omarchy.org/$MIRROR/$ARCH"
            echo "OUTPUT_DIR=build-output/$MIRROR/$ARCH"
          } >> "$GITHUB_ENV"
          echo "artifact=omarchy-repo-$ARCH-$MIRROR" >> "$GITHUB_OUTPUT"
          echo "packages_key=$(printf '%s\0' "${packages[@]}" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Reuse packages whose build inputs have not changed.
      - name: Restore repository tree
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.REPO_DIR }}
          key: omarchy-repo-v2-${{ env.ARCH }}-${{ env.MIRROR }}-${{ steps.meta.outputs.packages_key }}-${{ hashFiles('pkgbuilds/**', 'build/**', 'helpers/**', 'bin/**') }}

      # The builder and runner use different user IDs.
      - name: Prepare output directories
        run: |
          mkdir -p "$OUTPUT_DIR" "$REPO_DIR" src logs
          chmod -R a+rwX build-output pkgs.omarchy.org src

      - name: Build plan
        run: |
          read -r -a packages <<< "$PACKAGES"
          bin/repo build --arch "$ARCH" --mirror "$MIRROR" --dry-run --package "${packages[@]}"

      - name: Build packages
        run: |
          read -r -a packages <<< "$PACKAGES"
          bin/repo build --arch "$ARCH" --mirror "$MIRROR" --package "${packages[@]}"

      # Replaces bin/repo sign + promote, which need the repository host's key.
      - name: Publish into the repository tree and write omarchy.db
        run: |
          shopt -s nullglob
          files=("$OUTPUT_DIR"/*.pkg.tar.zst "$OUTPUT_DIR"/*.pkg.tar.xz)
          echo "new package files: ${#files[@]}"
          [[ ${#files[@]} -gt 0 ]] && cp -v "${files[@]}" "$REPO_DIR/"
          chmod -R a+rwX pkgs.omarchy.org
          bin/repo update --local --arch "$ARCH" --mirror "$MIRROR"

      - name: Verify repository
        id: verify
        run: |
          source helpers/package-metadata.sh
          pkgbuilds="$PWD/pkgbuilds"
          cd "$REPO_DIR"
          dbdir=$(mktemp -d)
          trap 'rm -rf "$dbdir"' EXIT
          tar --use-compress-program=unzstd -xf omarchy.db.tar.zst -C "$dbdir"
          shopt -s nullglob
          descriptions=("$dbdir"/*/desc)
          if [[ ${#descriptions[@]} == 0 ]]; then
            echo "::error::The repository contains no packages." >&2
            exit 1
          fi
          for desc in "${descriptions[@]}"; do
            awk '
              /^%BASE%$/ { getline; base=$0 }
              /^%NAME%$/ { getline; name=$0 }
              END { print (base != "" ? base : name) }
            ' "$desc"
          done > "$dbdir/pkgbases"
          echo "== pkgbases in omarchy.db =="
          sort -u "$dbdir/pkgbases"
          missing=0
          read -r -a packages <<< "$PACKAGES"
          for package in "${packages[@]}"; do
            pkgbase=$(package_pkgbuild_var "$pkgbuilds/$package" pkgbase)
            [[ -n $pkgbase ]] || pkgbase=$(package_pkgbuild_var "$pkgbuilds/$package" pkgname)
            grep -Fxq "$pkgbase" "$dbdir/pkgbases" || { echo "missing pkgbase: $pkgbase ($package)" >&2; missing=1; }
          done
          du -sh .
          exit $missing

      - name: Summarize available packages
        id: summary
        if: always() && steps.meta.outcome == 'success'
        run: |
          shopt -s nullglob
          files=("$REPO_DIR"/*.pkg.tar.zst "$REPO_DIR"/*.pkg.tar.xz "$OUTPUT_DIR"/*.pkg.tar.zst "$OUTPUT_DIR"/*.pkg.tar.xz)
          {
            echo "## aarch64 packages ($MIRROR)"
            echo
            if [[ ${#files[@]} -gt 0 ]]; then
              printf '%s\n' "${files[@]}"
            else
              echo "No packages are available. Check the selected recipes, architectures, and channels."
              echo "::error::No package artifacts were produced or restored." >&2
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep completed packages for diagnostics even if another recipe fails.
      - name: Upload packages
        if: always() && steps.meta.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-aarch64-${{ env.MIRROR }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/*.pkg.tar.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ env.REPO_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.ARCH }}-${{ env.MIRROR }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Basecamp on failure
        if: failure() && env.BASECAMP_CHATBOT_URL != ''
        env:
          BASECAMP_CHATBOT_URL: ${{ secrets.BASECAMP_CHATBOT_URL }}
        run: |
          curl -s -o /dev/null \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content \
              "🔴 <strong>aarch64 build failed</strong><br><a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View run</a>" \
              '{content: $content}')" \
            "$BASECAMP_CHATBOT_URL"
